<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe7">
  <title>System states / Gather Prototype</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/site-enhancements.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/system-states.css">
</head>
<body class="system-body">
  <a class="skip-link" href="#system-main">Skip to system state</a>
  <header class="site-header"><a class="brand" href="../index.html" aria-label="Gather home"><span class="brand-mark" aria-hidden="true">G</span><span>gather<span class="brand-dot">.</span></span></a><a class="text-link" href="prototype-hub.html">Open prototype map <span aria-hidden="true">&#8599;</span></a></header>
  <main id="system-main" class="system-main">
    <section class="system-card" aria-labelledby="system-title">
      <div class="system-symbol" data-system-symbol aria-hidden="true">!</div>
      <p class="eyebrow" data-system-eyebrow>Something needs a second look</p>
      <h1 id="system-title" data-system-title>We lost<br><em>that page.</em></h1>
      <p class="system-copy" data-system-copy>The page may have moved, or the link may have expired. Let's get you somewhere useful.</p>
      <div class="system-actions"><button class="button button-dark" type="button" data-system-primary>Go home <span aria-hidden="true">&#8594;</span></button><button class="outline-button" type="button" data-system-secondary>Try again</button></div>
      <p class="system-feedback" role="status" aria-live="polite" data-system-feedback></p>
      <div class="state-preview" role="group" aria-label="System state preview"><span class="preview-label">Prototype states</span><button type="button" data-system-state="404">404</button><button type="button" data-system-state="500">500</button><button type="button" data-system-state="maintenance">Maintenance</button><button type="button" data-system-state="offline">Offline</button><button type="button" data-system-state="loading">Loading</button><button type="button" data-system-state="empty">Empty</button><button type="button" data-system-state="denied">Access denied</button></div>
    </section>
  </main>
  <div class="toast" role="status" aria-live="polite" data-toast-region></div>
  <script type="module" src="../scripts/system-states.js"></script>
  <script type="module" src="../scripts/site-enhancements.js"></script>
</body>
</html>
