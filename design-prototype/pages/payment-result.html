<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe7">
  <title>Payment result / Gather Prototype</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/site-enhancements.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/payment-result.css">
</head>
<body class="payment-body">
  <a class="skip-link" href="#payment-main">Skip to payment result</a>
  <header class="site-header payment-header"><a class="brand" href="../index.html" aria-label="Gather home"><span class="brand-mark" aria-hidden="true">G</span><span>gather<span class="brand-dot">.</span></span></a><span class="checkout-secure">&#128274; Secure payment</span><a class="text-link" href="events.html">Back to discover <span aria-hidden="true">&#8599;</span></a></header>
  <main id="payment-main" class="payment-main">
    <section class="payment-card" data-payment-state="pending">
      <div class="result-symbol" data-result-symbol aria-hidden="true">...</div>
      <p class="eyebrow" data-result-eyebrow>Payment status</p>
      <h1 data-result-title>Payment is<br><em>processing.</em></h1>
      <p class="result-copy" data-result-copy>We have your order. Stripe is confirming the payment now, and your ticket will appear as soon as it is complete.</p>
      <div class="order-reference"><span>Order reference</span><strong>GTH-240926-0142</strong><button type="button" data-copy-reference aria-label="Copy order reference">Copy</button></div>
      <div class="result-actions"><button class="button button-dark" type="button" data-primary-action>View order status <span aria-hidden="true">&#8594;</span></button><button class="outline-button" type="button" data-toast="Support request preview">Contact support</button></div>
      <div class="result-preview"><span class="preview-label">Prototype states</span><button type="button" data-preview-state="success">Success</button><button type="button" data-preview-state="pending">Pending</button><button type="button" data-preview-state="failed">Failed</button><button type="button" data-preview-state="cancelled">Cancelled</button></div>
    </section>
  </main>
  <div class="toast" role="status" aria-live="polite" data-toast-region></div>
  <script type="module" src="../scripts/payment-result.js"></script>
  <script type="module" src="../scripts/site-enhancements.js"></script>
</body>
</html>
